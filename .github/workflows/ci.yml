name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --extra cpu --extra dev
      - run: uv run ruff check .
      - run: uv run pytest -q
      - run: uv run nightlab ledger-validate
      - run: uv run nightlab render --check
