name: baseline
claim: Reference run. A pre-norm decoder with RoPE, RMSNorm, SwiGLU, untied embeddings, AdamW.
source: ""
seed: 1337
model:
  n_layer: 8
  n_head: 8
  n_embd: 512
  block_size: 1024
  attention: causal
  mlp: swiglu
  norm: rmsnorm
optim:
  name: adamw
  lr: 0.0006
  weight_decay: 0.1
  betas: [0.9, 0.95]
  warmup_steps: 100
train:
  batch_size: 32
  seq_len: 1024
  wall_seconds: 600
  eval_every_seconds: 60
  eval_batches: 20
  compile: true
  dtype: bfloat16
data:
  dataset: fineweb-edu
