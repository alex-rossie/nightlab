[project]
name = "nightlab"
version = "0.1.0"
description = "An autonomous research lab in a repo: reads new LLM papers nightly, reimplements them at small scale, runs them on one consumer GPU, and publishes whether they replicated."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Alex Rossie" }]
dependencies = [
    "numpy>=2.0",
    "tiktoken>=0.9",
    "pyyaml>=6.0",
    "jsonschema>=4.23",
    "requests>=2.32",
]

[project.optional-dependencies]
cpu = ["torch>=2.8"]
rocm = ["torch>=2.8", "triton-rocm; sys_platform == 'linux'"]
data = ["datasets>=3.0"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
nightlab = "nightlab.cli:main"

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "rocm" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-rocm", extra = "rocm" },
]
triton-rocm = [{ index = "pytorch-rocm", extra = "rocm" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nightlab"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
